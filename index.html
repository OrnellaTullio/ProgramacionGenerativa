<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Obra Generativa — Familia Marden</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      color: #ccc;
    }

    #canvas-wrapper {
      position: relative;
      border: 12px solid white;
      box-shadow: 0 0 60px rgba(0,0,0,0.8);
      background: #f0ece3;
    }

    #controls {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 660px;
    }

    .ctrl-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .ctrl-label {
      width: 130px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #888;
    }

    .ctrl-sublabel {
      font-size: 10px;
      color: #555;
      width: 160px;
    }

    input[type="range"] {
      flex: 1;
      accent-color: #333;
      cursor: pointer;
    }

    .val-display {
      width: 36px;
      text-align: right;
      font-size: 12px;
      color: #aaa;
    }

    #controls {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 660px;
    }

    .ctrl-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .ctrl-label {
      width: 130px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #888;
    }

    .ctrl-sublabel {
      font-size: 10px;
      color: #555;
      width: 160px;
    }

    input[type="range"] {
      flex: 1;
      accent-color: #333;
      cursor: pointer;
    }

    .val-display {
      width: 36px;
      text-align: right;
      font-size: 12px;
      color: #aaa;
    }

    #btn-row {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      padding: 12px;
      background: transparent;
      border: 1px solid #555;
      color: #aaa;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover { border-color: #ccc; color: #fff; }

    #hint {
      margin-top: 10px;
      font-size: 10px;
      color: #444;
      text-align: center;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

<div id="canvas-wrapper">
  <div id="sketch-container"></div>
</div>

<div id="controls">
  <div class="ctrl-row">
    <span class="ctrl-label">Densidad</span>
    <span class="ctrl-sublabel">cantidad de trazos</span>
    <input type="range" id="densidad" min="10" max="300" value="80">
    <span class="val-display" id="v-densidad">80</span>
  </div>
  <div class="ctrl-row">
    <span class="ctrl-label">Grosor</span>
    <span class="ctrl-sublabel">peso de línea</span>
    <input type="range" id="grosor" min="1" max="20" value="4">
    <span class="val-display" id="v-grosor">4</span>
  </div>
  <div class="ctrl-row">
    <span class="ctrl-label">Curvatura</span>
    <span class="ctrl-sublabel">tensión de bezier</span>
    <input type="range" id="curvatura" min="5" max="120" value="40">
    <span class="val-display" id="v-curvatura">40</span>
  </div>
  <div class="ctrl-row">
    <span class="ctrl-label">Caos</span>
    <span class="ctrl-sublabel">variación / ruido</span>
    <input type="range" id="caos" min="0" max="100" value="30">
    <span class="val-display" id="v-caos">30</span>
  </div>
  <div class="ctrl-row">
    <span class="ctrl-label">Escala</span>
    <span class="ctrl-sublabel">tamaño de sellitos</span>
    <input type="range" id="escala" min="10" max="100" value="38">
    <span class="val-display" id="v-escala">38</span>
  </div>

  <div id="btn-row">
    <button id="btn-regen">↺ Regenerar</button>
    <button id="btn-random">⚄ Random</button>
  </div>
</div>

<script>
let sketchInstance;

// Parámetros globales — estos son los que después conectan al sonido
let params = {
  densidad: 80,
  grosor: 4,
  curvatura: 40,
  caos: 30,
  escala: 38
};

// ── SELLITOS ─────────────────────────────────────────────────────────────────
// Cada sellito es una función que dibuja un trazo característico
// centrado en (0,0), luego se aplica transform (translate+rotate+scale)

function selloBucle(p, sw) {
  // Bucle cerrado oval — el trazo más icónico de Marden
  p.strokeWeight(sw);
  let c = params.curvatura;
  p.beginShape();
  p.vertex(0, -c * 0.4);
  p.bezierVertex( c * 0.9,  -c * 0.6,  c * 0.9,  c * 0.6,  0,  c * 0.4);
  p.bezierVertex(-c * 0.9,  c * 0.6,  -c * 0.9, -c * 0.6,  0, -c * 0.4);
  p.endShape();
}

function selloArco(p, sw) {
  // Arco simple abierto
  let c = params.curvatura;
  p.strokeWeight(sw);
  p.beginShape();
  p.vertex(-c * 0.6, c * 0.3);
  p.bezierVertex(-c * 0.5, -c * 0.8,  c * 0.5, -c * 0.8,  c * 0.6, c * 0.3);
  p.endShape();
}

function selloEspiral(p, sw) {
  // Espiral abierta — vuelta y media
  let c = params.curvatura * 0.5;
  p.strokeWeight(sw);
  p.beginShape();
  p.vertex(c * 0.8, 0);
  p.bezierVertex(c * 0.8, -c * 1.2,  -c * 1.2, -c * 1.2,  -c * 1.2, 0);
  p.bezierVertex(-c * 1.2, c * 1.2,  c * 0.2, c * 1.2,  c * 0.2, c * 0.3);
  p.endShape();
}

function selloCruce(p, sw) {
  // Dos trazos que se cruzan
  let c = params.curvatura * 0.6;
  p.strokeWeight(sw);
  p.beginShape();
  p.vertex(-c, -c * 0.8);
  p.bezierVertex(-c * 0.2, 0,  c * 0.2, 0,  c, c * 0.8);
  p.endShape();
  p.beginShape();
  p.vertex(-c, c * 0.8);
  p.bezierVertex(-c * 0.3, 0,  c * 0.3, 0,  c, -c * 0.8);
  p.endShape();
}

function selloHilo(p, sw) {
  // Línea fina ondulada larga — conecta zonas
  let c = params.curvatura * 0.8;
  p.strokeWeight(sw * 0.4);
  p.beginShape();
  p.vertex(-c, 0);
  p.bezierVertex(-c * 0.5, -c * 0.6,  c * 0.5, c * 0.6,  c, 0);
  p.endShape();
}

function selloPunto(p, sw) {
  // Pequeño punto de tinta — los "lunares" dispersos de Marden
  p.strokeWeight(sw * 1.5);
  let r = sw * 0.8;
  p.point(0, 0);
  // a veces un punto secundario cerca
  p.point(r * 1.5, r);
}

const SELLOS = [selloBucle, selloArco, selloEspiral, selloCruce, selloHilo, selloPunto];
// Pesos de probabilidad: bucles y arcos más frecuentes, puntos raros
const PESOS  = [0.30,       0.25,      0.18,         0.15,       0.08,      0.04];

function elegirSello() {
  let r = Math.random();
  let acc = 0;
  for (let i = 0; i < PESOS.length; i++) {
    acc += PESOS[i];
    if (r < acc) return SELLOS[i];
  }
  return SELLOS[0];
}

// ── SKETCH P5 ─────────────────────────────────────────────────────────────────
const sketch = function(p) {
  const W = 660, H = 500;

  p.setup = function() {
    let cnv = p.createCanvas(W, H);
    cnv.parent('sketch-container');
    p.noLoop();
    dibujar();
  };

  function dibujar() {
    p.background(240, 236, 227); // papel levemente cálido
    p.noFill();
    p.stroke(15, 12, 8); // tinta negra con muy leve calidez

    let n = params.densidad;
    let escala = params.escala;
    let caos = params.caos / 100;

    for (let i = 0; i < n; i++) {
      let x = p.random(W);
      let y = p.random(H);
      let rot = p.random(p.TWO_PI);
      let sc = escala * p.random(0.5 + caos * 0.5, 1.2 + caos * 0.8);
      let sw = params.grosor * p.random(0.5, 1.0 + caos);

      // Desplazamiento extra con caos
      x += p.random(-caos * 30, caos * 30);
      y += p.random(-caos * 30, caos * 30);

      let sello = elegirSello();

      p.push();
      p.translate(x, y);
      p.rotate(rot);
      p.scale(sc / 40); // normalizado a escala base 40
      sello(p, sw);
      p.pop();
    }
  }

  p.redraw = function() {
    dibujar();
  };

  p._customRedraw = dibujar;
};

// ── INIT ──────────────────────────────────────────────────────────────────────
sketchInstance = new p5(sketch);

// Sliders
['densidad','grosor','curvatura','caos','escala'].forEach(key => {
  const slider = document.getElementById(key);
  const disp   = document.getElementById('v-' + key);
  slider.addEventListener('input', () => {
    params[key] = parseFloat(slider.value);
    disp.textContent = slider.value;
    sketchInstance._customRedraw();
  });
});

document.getElementById('btn-regen').addEventListener('click', () => {
  sketchInstance._customRedraw();
});

document.getElementById('btn-random').addEventListener('click', () => {
  params.densidad  = Math.floor(Math.random() * 290) + 10;
  params.grosor    = Math.round(Math.random() * 19 + 1);
  params.curvatura = Math.round(Math.random() * 115 + 5);
  params.caos      = Math.round(Math.random() * 100);
  params.escala    = Math.round(Math.random() * 90 + 10);

  // Sincronizar sliders y displays
  ['densidad','grosor','curvatura','caos','escala'].forEach(key => {
    document.getElementById(key).value = params[key];
    document.getElementById('v-' + key).textContent = params[key];
  });

  sketchInstance._customRedraw();
});
</script>
</body>
</html>
